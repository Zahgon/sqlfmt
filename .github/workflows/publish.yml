name: Build and Publish Package

on:
  pull_request:
    branches:
      - main
    types:
      - closed

jobs:
  publish-package:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v') }}
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      deployments: write
      id-token: write
      packages: write
    steps:
      - name: Check out repo main branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Get project Version
        id: project_version
        run: echo "project_version=$(cargo pkgid | cut -d'#' -f2 | cut -d'@' -f2)" >> $GITHUB_OUTPUT

      - name: Build release binary
        run: |
          cargo build --release --locked
          mkdir -p dist
          tar -czf dist/sqlfmt-v${{ steps.project_version.outputs.project_version }}-x86_64-linux.tar.gz -C target/release sqlfmt

      - name: Create a Github Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.project_version.outputs.project_version }}
          target_commitish: main
          token: ${{ secrets.SQLFMT_RELEASE_TOKEN }}
          body_path: CHANGELOG.md
          files: |
            LICENSE
            dist/sqlfmt-*.tar.gz
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ steps.project_version.outputs.project_version }}
